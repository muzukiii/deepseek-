[project]
name = "AstraBot"
version = "0.1.0"
description = "AstraBot"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[fastapi]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "python-dotenv>=1.0.0",
    "httpx[socks]>=0.28.0",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "mcp[cli]>=1.0.0",
    # 不依赖 orjson：本项目与 nonebot2 均未使用它，仅 fastapi 将其作为
    # 可选的 JSON 序列化加速项（缺失时自动降级到标准库）。
    # 在本机它会被 Windows 智能应用控制拦截，导致启动直接失败。
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astrabot*"]
exclude = ["wheels*", "*.egg-info*"]

[tool.nonebot]
plugin_dirs = ["astrabot"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]

